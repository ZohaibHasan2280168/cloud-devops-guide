#cloud-config
# ==============================================================================
# AWS EC2 Cloud-Init User Data Script (YAML)
# Author: Zohaib Hassan (Cloud & DevOps Engineer)
# Usage: Paste directly into AWS EC2 Launch Wizard -> Advanced Details -> User Data
# ==============================================================================

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - jq
  - unzip
  - htop
  - net-tools
  - ca-certificates
  - gnupg
  - lsb-release

groups:
  - docker

users:
  - default
  - name: ubuntu
    groups: docker
    sudo: ALL=(ALL) NOPASSWD:ALL

runcmd:
  # 1. Docker Official Installation
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

  # 2. Kubectl Installation
  - curl -LO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
  - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
  - rm -f kubectl

  # 3. Helm 3 Installation
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  # 4. AWS CLI v2 Installation
  - curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install --update
  - rm -rf /tmp/aws /tmp/awscliv2.zip

  # 5. Terraform Installation
  - wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
  - apt-get update -y
  - apt-get install -y terraform

final_message: "DevOps Node successfully bootstrapped and ready for container and cloud workloads."
